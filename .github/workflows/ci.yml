name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest -q
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy
        run: mypy src

  fdb-edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install LiveKit and Gemini edge
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,fdb]'
      - name: FDB bridge and provider contracts
        run: python -m pytest -q tests/test_fdb_contracts.py tests/test_fdb_config.py tests/test_fdb_livekit_bridge.py
      - name: Optional edge import
        env:
          GOOGLE_API_KEY: contract-test-placeholder
        run: |
          python - <<'PY'
          from continuum.integrations.fdb.agent import server
          from continuum.integrations.fdb.provider import GeminiNativeAudioProvider, NativeAudioConfig

          model = GeminiNativeAudioProvider().build_model(NativeAudioConfig())
          assert server is not None
          assert model.capabilities.audio_output
          print("FDB LiveKit/Gemini import contract passed")
          PY

  multimodal:
    # Real local ASR (faster-whisper) + OCR (RapidOCR) on the committed raw
    # WAV/PNG fixtures; the default `test` job skips these without models.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install recognizers
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,multimodal]'
      - name: Fetch ASR model (setup-time download only)
        run: continuum fetch-models --asr base.en
      - name: Real recognition tests (must not skip)
        run: |
          python -m pytest -q -rs tests/test_real_recognition.py | tee rec.txt
          ! grep -q SKIPPED rec.txt
      - name: Raw-media runtime evaluation
        run: |
          continuum eval-multimodal
          grep -q '"skipped": false' reports/raw_media_eval.json
