[project]
name = "continuum"
version = "0.6.0"
description = "CONTINUUM — manifest-driven, interruptible real-time agents for Samsung PRISM Theme 05"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "CONTINUUM Team", email = "continuum@prism.local" }]
keywords = ["agent","interruptible","samsung-prism","dialogue","provenance"]
dependencies = [
    "fastapi>=0.110,<1",
    "jsonschema>=4.23",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.4",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0,<2",
    "rich>=13.7",
    "typer>=0.12",
    "uvicorn[standard]>=0.28,<1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]

dense = [
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "rank-bm25>=0.2.2",
]
# Local speech recognition; the model itself is fetched once with
# `continuum fetch-models` (never at request time).
asr = [
    "faster-whisper>=1.0",
]
# Local OCR for camera frames; detection/recognition models ship in the wheel.
vision = [
    "rapidocr-onnxruntime>=1.3",
]
multimodal = [
    "continuum[asr,vision]",
]
# Matches the official FDB-v3 LiveKit stack and includes Gemini native audio.
# Imports stay lazy, so deterministic core tests do not require cloud keys.
# LiveKit Agents 1.3.11 imports the legacy OpenTelemetry ``LogData`` symbol;
# the 1.39.1 OpenTelemetry family is the newest known-compatible family.
fdb = [
    "ffmpeg-python>=0.2",
    "livekit~=1.0",
    "livekit-agents[google,openai]==1.3.11",
    "livekit-plugins-google==1.3.12",
    "livekit-plugins-silero==1.3.11",
    "numpy>=1.26",
    "opentelemetry-api==1.39.1",
    "opentelemetry-exporter-otlp==1.39.1",
    "opentelemetry-sdk==1.39.1",
    "pydub>=0.25",
]
fdb-eval = [
    "nemo_toolkit[asr]>=2.0",
    "openai>=1.0",
]

[project.scripts]
continuum = "continuum.cli:main"
continuum-fdb-agent = "continuum.integrations.fdb.runner:main"
continuum-fdb-contract = "continuum.integrations.fdb.scenario_runner:main"
continuum-fdb-media-smoke = "continuum.integrations.fdb.live_smoke:main"

[project.urls]
Repository = "https://github.com/itsZaid05/CONTINUUM"
Issues = "https://github.com/itsZaid05/CONTINUUM/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/continuum"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM"]
ignore = ["B008"]  # Typer idiom uses function calls in defaults by design

[tool.ruff.lint.per-file-ignores]
# The legacy demo backend carries long user-facing copy and regular-expression
# literals. Format and every semantic lint rule still run on it; only physical
# line length is exempted.
"backend/**/*.py" = ["E501"]
"examples/*.py" = ["E501"]
"src/continuum/api.py" = ["E501"]
"src/continuum/contracts.py" = ["E501", "SIM102", "UP042", "B904"]
"src/continuum/cli.py" = ["E501", "E741"]
"src/continuum/delta_arbiter.py" = ["E501"]
"src/continuum/llm.py" = ["E501", "SIM102", "SIM108", "B904", "F841"]
"src/continuum/perception.py" = ["E501"]
"src/continuum/policy.py" = ["E501"]
"src/continuum/dialogue.py" = ["E501"]
"src/continuum/shadow.py" = ["E501"]
"src/continuum/branch_manager.py" = ["E501"]
"src/continuum/provenance.py" = ["E501"]
"src/continuum/ledger.py" = ["E501"]
"src/continuum/versioned_state.py" = ["E501"]
"src/continuum/replay.py" = ["E501", "SIM108"]
"src/continuum/runtime.py" = ["E501"]
"src/continuum/generic_planner.py" = ["E501"]
"src/continuum/slots.py" = ["E501"]
"src/continuum/evaluation/*.py" = ["E501"]
"tests/test_contract.py" = ["B017", "E501"]
"tests/*" = ["B017", "E501", "E702", "F841"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
warn_unused_ignores = false
explicit_package_bases = true
# Phase 1 relaxed; Phase 5 will enable stricter checks

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
